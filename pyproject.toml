[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantix-ai"
version = "0.1.8"
description = "A Semantic Type System for AI outputs — validate intent, not just shape."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Akhona Eland", email = "akhonabest7@gmail.com" },
]
keywords = [
    "ai",
    "guardrails",
    "intent",
    "llm",
    "semantic",
    "type-system",
    "validation",
    "nlp",
    "pydantic",
    "openai",
    "ai-safety",
    "output-validation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
embeddings = ["sentence-transformers>=2.2"]
nli = ["sentence-transformers>=2.2"]
mcp = ["mcp[cli]>=1.0"]
turbo = ["onnxruntime>=1.16", "tokenizers>=0.15", "huggingface-hub>=0.20"]
instructor = ["instructor>=1.0"]
pydantic-ai = ["pydantic-ai>=0.1"]
langchain = ["langchain-core>=0.3"]
all = [
    "openai>=1.0",
    "sentence-transformers>=2.2",
    "mcp[cli]>=1.0",
    "onnxruntime>=1.16",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
    "instructor>=1.0",
    "pydantic-ai>=0.1",
    "langchain-core>=0.3",
]
dev = [
    "openai>=1.0",
    "sentence-transformers>=2.2",
    "mcp[cli]>=1.0",
    "onnxruntime>=1.16",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4.0",
    "instructor>=1.0",
    "pydantic-ai>=0.1",
    "langchain-core>=0.3",
]

[project.urls]
Homepage = "https://github.com/labrat-akhona/semantix-ai"
Repository = "https://github.com/labrat-akhona/semantix-ai"
"Bug Tracker" = "https://github.com/labrat-akhona/semantix-ai/issues"
Documentation = "https://github.com/labrat-akhona/semantix-ai#readme"
Changelog = "https://github.com/labrat-akhona/semantix-ai/releases"

[tool.hatch.build.targets.wheel]
packages = ["semantix"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
