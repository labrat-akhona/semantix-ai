[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantix-ai"
version = "0.3.0"
description = "A Semantic Type System for AI outputs — validate intent, not just shape."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Akhona Eland", email = "akhonabest7@gmail.com" },
]
keywords = [
    "ai",
    "guardrails",
    "intent",
    "llm",
    "semantic",
    "type-system",
    "validation",
    "nlp",
    "pydantic",
    "openai",
    "ai-safety",
    "output-validation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
embeddings = ["sentence-transformers>=2.2"]
nli = ["sentence-transformers>=2.2"]
mcp = ["mcp[cli]>=1.0"]
turbo = ["onnxruntime>=1.16", "tokenizers>=0.15", "huggingface-hub>=0.20"]
popia = ["semantix-ai[turbo]"]
gdpr = ["semantix-ai[turbo]"]
train = [
    "transformers>=4.40",
    "torch>=2.0",
    "datasets>=2.14",
    "accelerate>=0.30",
    "optimum[onnxruntime]>=1.20",
]
instructor = ["instructor>=1.0"]
pydantic-ai = ["pydantic-ai>=0.1"]
langchain = ["langchain-core>=0.3"]
guardrails = ["guardrails-ai>=0.5.0"]
dspy = ["dspy>=2.6"]
all = [
    "openai>=1.0",
    "sentence-transformers>=2.2",
    "mcp[cli]>=1.0",
    "onnxruntime>=1.16",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
    "instructor>=1.0",
    "pydantic-ai>=0.1",
    "langchain-core>=0.3",
    # guardrails-ai intentionally omitted — see [guardrails] extra.
    # The package is currently quarantined on PyPI; users who want the
    # integration can install it explicitly via `pip install semantix-ai[guardrails]`
    # once upstream lifts the quarantine.
    "dspy>=2.6",
]
dev = [
    "openai>=1.0",
    "sentence-transformers>=2.2",
    "mcp[cli]>=1.0",
    "onnxruntime>=1.16",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "ruff>=0.4.0",
    "instructor>=1.0",
    "pydantic-ai>=0.1",
    "langchain-core>=0.3",
    # guardrails-ai is quarantined on PyPI; tests for the integration use
    # pytest.importorskip and skip cleanly when the package is unavailable.
    "dspy>=2.6",
]
docs = [
    "mkdocs-material>=9.0",
]

[project.scripts]
semantix = "semantix.cli:main"

[project.urls]
Homepage = "https://github.com/labrat-akhona/semantix-ai"
Repository = "https://github.com/labrat-akhona/semantix-ai"
"Bug Tracker" = "https://github.com/labrat-akhona/semantix-ai/issues"
Documentation = "https://github.com/labrat-akhona/semantix-ai#readme"
Changelog = "https://github.com/labrat-akhona/semantix-ai/releases"

[tool.hatch.build.targets.wheel]
packages = ["semantix"]

[tool.hatch.build.targets.sdist]
include = [
    "/semantix",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["examples", "tools", "articles", "examples.py", "work_demo.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# ruff format owns line length; E501 only fires on what it cannot split
# (long strings, URLs, comments). Keeping both means the formatter and the
# linter disagree with each other.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"semantix/__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require network access and real HF downloads (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"
