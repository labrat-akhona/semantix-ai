name: EXPERIMENT AVX2 vs qint8

# Throwaway: roadmap Now item 3. Runs on every push to exp/avx2-comparison so the runner
# lottery can be re-rolled (an empty commit is enough) until it lands on a CPU without
# avx512f. Never merge this workflow to master.
on:
  push:
    branches:
      - 'exp/avx2-comparison'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The hosted fleet is mixed. Sample several runners per push and only do the expensive
    # work on the ones without AVX-512, which is the hardware the AVX2 file exists to serve.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HuggingFace hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ runner.os }}-nli-popia-v1-all-files

      - name: Install
        run: pip install -e ".[popia]"

      - name: Runner CPU
        run: lscpu | grep -E "Model name|Flags" || true

      - name: Compare the AVX2 file against a qint8 file
        if: steps.cpu.outputs.avx512 == 'false'
        run: python scripts/exp_avx2_vs_qint8.py

      - uses: actions/upload-artifact@v4
        if: steps.cpu.outputs.avx512 == 'false'
        with:
          name: exp-avx2-report-${{ github.run_attempt }}-${{ matrix.shard }}
          path: exp_avx2_report.json
