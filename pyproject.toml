[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantix-ai"
version = "0.1.0"
description = "A Semantic Type System for AI outputs — validate intent, not just shape."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akhona Eland" }]
keywords = ["llm", "validation", "semantic", "type-system", "intent", "ai", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/labrat-akhona/semantix-ai"
Repository = "https://github.com/labrat-akhona/semantix-ai"
"Bug Tracker" = "https://github.com/labrat-akhona/semantix-ai/issues"

[project.optional-dependencies]
openai = ["openai>=1.0"]
embeddings = ["sentence-transformers>=2.2"]
all = ["openai>=1.0", "sentence-transformers>=2.2"]
dev = [
    "openai>=1.0",
    "sentence-transformers>=2.2",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["semantix"]
exclude = ["semantix/tests"]
